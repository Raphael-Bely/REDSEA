# Déploiement Netlify. Les en-têtes de sécurité reprennent ceux de vercel.json :
# toute modification de l'un est à reporter dans l'autre.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 exige Node 22.
  NODE_VERSION = "22"
  # Édition par défaut du site : "classique" (beige et rouge) ou "noir" (noir et rose).
  REDSEA_PALETTE = "classique"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
